name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release-android:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env
        run: |
          mkdir -p config/env
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" \
            > config/env/.env

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" \
            | base64 --decode > android/app/splito-release.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=splito-release.jks
          EOF

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Splito ${{ steps.version.outputs.VERSION }}
          body: |
            ## Download Splito for Android
            Click **app-release.apk** below to download.

            **Install Instructions**
            1. Download the APK on your Android device
            2. Settings → Security → Allow unknown sources
            3. Open the APK and install
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
          make_latest: true

  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.4"

      - run: flutter pub get

      - name: Create .env
        run: |
          mkdir -p config/env
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" \
            > config/env/.env

      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - uses: actions/deploy-pages@v4